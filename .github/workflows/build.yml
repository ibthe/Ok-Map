name: Build Ok Map APK

on:
  push:
    branches: [main, master, feature/offline-navigation]
  workflow_dispatch:
    inputs:
      osm_url:
        description: "Optional: direct link to a .osm.pbf of Georgia (country) if automatic download fails"
        required: false
        default: ""
      sat_url:
        description: "Optional: direct URL of a raster satellite imagery .mbtiles (leave empty for the stylised satellite view)"
        required: false
        default: ""
      sat_tiles:
        description: "Satellite imagery XYZ tile URL (empty = NAPR orthophoto of Georgia, none = no imagery)"
        required: false
        default: ""
      sat_zoom:
        description: "Max zoom of the imagery for the whole country (empty = 12; each level is about 3-4x bigger)"
        required: false
        default: ""
      sat_detail:
        description: "Extra high-zoom areas separated by spaces: west,south,east,north,zoom (empty = Tbilisi z16, none = no extra areas)"
        required: false
        default: ""

concurrency:
  group: ok-map-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Satellite imagery: by default the orthophoto 2016-2017 of the National Agency of Public Registry of Georgia (NAPR).
      # Put "none" into sat_tiles when starting the workflow by hand to build without imagery.
      SAT_TILES: ${{ inputs.sat_tiles || 'https://nt0.napr.gov.ge/NGCache?x={x}&y={y}&z={z}&l=ORTHO_GEORGIA_4' }}
      SAT_ZOOM: ${{ inputs.sat_zoom || '12' }}
      SAT_DETAIL: ${{ inputs.sat_detail || '44.70,41.62,44.95,41.80,16' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Map data (tiles, search index, relief) is rebuilt only when the tile tools change.
      # Fonts and the style are NOT part of this cache: they are cheap and are rebuilt on every run.
      # restore-keys also picks up the cache of older runs, so changing fonts/design never
      # triggers the 30-60 minute tile build again.
      - name: Cache map data
        id: mapdata
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/map.mbtiles
            app/src/main/assets/places.db
            app/src/main/assets/relief.mbtiles
            app/src/main/assets/places.stamp
            app/src/main/assets/graph.bin
            app/src/main/assets/graph.stamp
            app/src/main/assets/contours.mbtiles
            app/src/main/assets/contours.stamp
            app/src/main/assets/sat.mbtiles
            app/src/main/assets/sat.stamp
          # build_places.py / reference_places.json are NOT in the key: they only rebuild the search index
          # (see "Decide what has to be rebuilt"), the 30-60 min tile build stays cached
          key: mapdata-v3-${{ hashFiles('tools/fetch_osm.py', 'tools/finalize_tiles.py', 'tools/check_tiles.py', 'tools/mvt.py', 'tools/build_relief.py') }}
          restore-keys: |
            mapdata-v3-
            mapdata-v2-

      # decided once, before anything is built (a file check per step would change mid-run)
      - name: Decide what has to be rebuilt
        id: need
        run: |
          mkdir -p app/src/main/assets
          [ -s app/src/main/assets/map.mbtiles ] || { echo "tiles=true" >> "$GITHUB_OUTPUT"; echo "places=true" >> "$GITHUB_OUTPUT"; }
          [ -s app/src/main/assets/places.db ] || echo "places=true" >> "$GITHUB_OUTPUT"
          PH=$(cat tools/build_places.py tools/mvt.py tools/reference_places.json | sha1sum | cut -d' ' -f1)
          echo "$PH" > /tmp/places.stamp
          [ "$(cat app/src/main/assets/places.stamp 2>/dev/null)" = "$PH" ] || echo "places=true" >> "$GITHUB_OUTPUT"
          [ -s app/src/main/assets/graph.bin ] || echo "graph=true" >> "$GITHUB_OUTPUT"
          GH=$(cat tools/build_graph.py | sha1sum | cut -d' ' -f1)
          echo "$GH" > /tmp/graph.stamp
          [ "$(cat app/src/main/assets/graph.stamp 2>/dev/null)" = "$GH" ] || echo "graph=true" >> "$GITHUB_OUTPUT"
          [ -s app/src/main/assets/contours.mbtiles ] || echo "contours=true" >> "$GITHUB_OUTPUT"
          CH=$(cat tools/build_contours.py | sha1sum | cut -d' ' -f1)
          echo "$CH" > /tmp/contours.stamp
          [ "$(cat app/src/main/assets/contours.stamp 2>/dev/null)" = "$CH" ] || echo "contours=true" >> "$GITHUB_OUTPUT"
          SH=$(printf '%s|%s|%s|%s' "$(cat tools/build_satellite.py | sha1sum)" "$SAT_TILES" "$SAT_ZOOM" "$SAT_DETAIL" | sha1sum | cut -d' ' -f1)
          echo "$SH" > /tmp/sat.stamp
          [ "$SAT_TILES" != "none" ] && { [ -s app/src/main/assets/sat.mbtiles ] || echo "sat=true" >> "$GITHUB_OUTPUT"; [ "$(cat app/src/main/assets/sat.stamp 2>/dev/null)" = "$SH" ] || echo "sat=true" >> "$GITHUB_OUTPUT"; }
          [ -s app/src/main/assets/relief.mbtiles ] || echo "relief=true" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          ls -lh app/src/main/assets || true

      - name: Run synthetic road graph tests
        run: |
          python -m pip install --quiet numpy
          python tools/test_graph.py

      - name: Download OSM extract of Georgia (Geofabrik)
        if: steps.need.outputs.tiles == 'true' || steps.need.outputs.graph == 'true'
        env:
          OSM_URL: ${{ github.event.inputs.osm_url }}
        run: |
          mkdir -p data
          python tools/fetch_osm.py data/region.osm.pbf
          ls -lh data/region.osm.pbf

      - name: Build vector tiles with Planetiler (OpenMapTiles schema)
        if: steps.need.outputs.tiles == 'true'
        run: |
          curl -L --fail --retry 3 -o data/planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          mkdir -p app/src/main/assets
          java -Xmx4g -jar data/planetiler.jar \
            --osm-path=data/region.osm.pbf \
            --download \
            --output=app/src/main/assets/map.mbtiles \
            --force \
            --maxzoom=14
          ls -lh app/src/main/assets/map.mbtiles

      - name: Normalize MBTiles and verify tile content (layers, ka/ru/en names)
        if: steps.need.outputs.tiles == 'true'
        working-directory: tools
        run: |
          python finalize_tiles.py ../app/src/main/assets/map.mbtiles
          python check_tiles.py ../app/src/main/assets/map.mbtiles

      - name: Build offline search index
        if: steps.need.outputs.places == 'true'
        working-directory: tools
        run: |
          python build_places.py ../app/src/main/assets/map.mbtiles ../app/src/main/assets/places.db
          cp /tmp/places.stamp ../app/src/main/assets/places.stamp

      # Road graph is required for the offline car navigator; failures must fail CI.
      - name: Build offline road graph (car router)
        if: steps.need.outputs.graph == 'true'
        run: |
          python -m pip install --quiet osmium numpy
          python tools/build_graph.py data/region.osm.pbf app/src/main/assets/graph.bin
          ls -lh app/src/main/assets/graph.bin
          # smoke test on the real graph: Tbilisi -> Kutaisi by road is roughly 230 km
          python tools/route_check.py app/src/main/assets/graph.bin 41.7151 44.8271 42.2679 42.7180 190 320
          cp /tmp/graph.stamp app/src/main/assets/graph.stamp

      - name: Build relief tiles (hillshade + elevation readout)
        if: steps.need.outputs.relief == 'true'
        continue-on-error: true
        working-directory: tools
        run: python build_relief.py ../app/src/main/assets/relief.mbtiles

      # Contour lines for the "Высоты" map type, computed from the relief DEM. Optional: the APK builds without them.
      - name: Build contour lines (elevation map type)
        if: steps.need.outputs.contours == 'true' || steps.need.outputs.relief == 'true'
        continue-on-error: true
        run: |
          python -m pip install --quiet numpy pillow scipy contourpy shapely
          python tools/test_contours.py
          python tools/build_contours.py app/src/main/assets/relief.mbtiles app/src/main/assets/contours.mbtiles
          ls -lh app/src/main/assets/contours.mbtiles
          cp /tmp/contours.stamp app/src/main/assets/contours.stamp

      # Satellite imagery (NAPR orthophoto by default). Cached; rebuilt when the source, zoom or areas change.
      # If the server is unreachable the APK is still built (with the stylised satellite view).
      - name: Build satellite imagery from XYZ tiles
        if: env.SAT_TILES != 'none' && steps.need.outputs.sat == 'true'
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow
          DETAIL="$SAT_DETAIL"; [ "$DETAIL" = "none" ] && DETAIL=""
          # shellcheck disable=SC2086
          python tools/build_satellite.py app/src/main/assets/map.mbtiles app/src/main/assets/sat.mbtiles "$SAT_TILES" "$SAT_ZOOM" 10 $DETAIL
          ls -lh app/src/main/assets/sat.mbtiles
          cp /tmp/sat.stamp app/src/main/assets/sat.stamp

      - name: Build label fonts (Latin + Cyrillic + Georgian)
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq fonts-noto-core fonts-dejavu-core || true
          python -m pip install --quiet pillow numpy scipy fonttools
          rm -rf app/src/main/assets/glyphs
          python tools/build_glyphs.py app/src/main/assets/glyphs/NotoSans

      - name: Generate map styles (all colour themes x day / evening / night, plus satellite)
        run: |
          rm -f app/src/main/assets/style*.json
          for t in $(python tools/themes.py --list); do
            python tools/gen_style.py app/src/main/assets/style_$t.json --theme $t
            python tools/gen_style.py app/src/main/assets/style_${t}_dim.json --dim --theme $t
            python tools/gen_style.py app/src/main/assets/style_${t}_dark.json --dark --theme $t
          done
          python tools/gen_style.py app/src/main/assets/style_sat.json --sat
          python tools/gen_style.py app/src/main/assets/style_sat_dark.json --sat --dark
          python tools/themes.py
          python tools/test_compass.py
          ls -l app/src/main/assets/style_*.json | wc -l

      # Optional real satellite imagery: a raster MBTiles (png/jpg tiles, XYZ) of your region from a source you may use
      - name: Download satellite imagery (optional)
        if: inputs.sat_url != ''
        continue-on-error: true
        run: |
          curl -L --fail -o app/src/main/assets/sat.mbtiles "${{ inputs.sat_url }}"
          ls -lh app/src/main/assets/sat.mbtiles

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Ok Map APK
        run: gradle --no-daemon -Pvcode=${{ github.run_number }} :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ok-map-apk
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
